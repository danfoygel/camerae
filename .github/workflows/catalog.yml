# Rebuilds the camera catalog and publishes it to the public danfoygel/camerae-catalog repo,
# where the app downloads it from raw.githubusercontent.com. This repo is private, so the app
# can't read it directly.
#
# Setup: a deploy key with write access on camerae-catalog, its private half stored here as
# the CATALOG_DEPLOY_KEY secret. NV511_API_KEY is optional (see tools/build_catalog.py).

name: Catalog

on:
  schedule:
    - cron: "17 11 * * *"  # daily, early morning Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_catalog.py
      - tools/check_catalog.py
      - .github/workflows/catalog.yml

concurrency:
  group: catalog

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          NV511_API_KEY: ${{ secrets.NV511_API_KEY }}
        run: python3 tools/build_catalog.py --out build/cameras.json

      - name: Check out the published catalog
        uses: actions/checkout@v4
        with:
          repository: danfoygel/camerae-catalog
          ssh-key: ${{ secrets.CATALOG_DEPLOY_KEY }}
          path: published

      - name: Publish
        run: |
          version=$(jq -r .version build/cameras.json)
          generated=$(jq -r .generatedAt build/cameras.json)
          dest=published/v$version/cameras.json

          python3 tools/check_catalog.py build/cameras.json "$dest"

          # Skip the push when only the timestamp moved, so phones' ETags stay valid.
          if [ -f "$dest" ] && cmp -s <(jq -S 'del(.generatedAt)' "$dest") <(jq -S 'del(.generatedAt)' build/cameras.json); then
            echo "Catalog unchanged; nothing to publish."
            exit 0
          fi

          mkdir -p "$(dirname "$dest")"
          cp build/cameras.json "$dest"
          cat > published/README.md <<EOF
          # Camerae camera catalog

          Generated by the Camerae app's catalog workflow; don't edit by hand. Each schema version
          lives at \`v<N>/cameras.json\`, so older app builds keep reading the version they know.

          Last built $generated.
          EOF

          # One commit, force-pushed: the app only wants the latest file, and daily 1.4 MB
          # snapshots would bloat the repo for nothing.
          cd published
          git checkout --orphan next
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Catalog built $generated"
          git push --force origin next:main
          echo "Published v$version built $generated."
